[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seda-bus"
version = "0.2.0"
description = "A small, broker-less, staged (SEDA-style) message bus for Python"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Brian Taylor", email = "brian@resolvingarchitecture.io" }]
keywords = ["seda", "message-bus", "staged", "concurrency", "free-threading"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["ra-common"]

[project.urls]
Homepage = "https://resolvingarchitecture.io"
Repository = "https://github.com/resolvingarchitecture/seda-bus-python"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/seda_bus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
